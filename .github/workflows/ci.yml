name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-server

jobs:
  # ── Protobuf 检查 ──
  proto-lint:
    name: Buf Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - uses: bufbuild/buf-lint-action@v1

  # ── Go 测试 ──
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test -tags ci ./internal/... -v -count=1 -timeout 30s
      - run: go vet -tags ci ./...

  # ── 前端构建 ──
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile
      - run: cd web && pnpm run build
      - run: cd web && pnpm exec tsc --noEmit

  # ── Docker 镜像构建（PR 验证，不推送）──
  docker-build:
    name: Docker Build (no push)
    runs-on: ubuntu-latest
    needs: [proto-lint, go-test, web-build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm + 构建前端
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile && pnpm run build

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 Docker 镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Docker 镜像构建 & 推送到 ghcr（仅 main 分支）──
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [proto-lint, go-test, web-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm + 构建前端
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile && pnpm run build

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 提取 metadata（标签/注解）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Release：构建 Agent 部署包并发布 ──
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 构建全平台 Agent 部署包
        run: make deploy-agent-all

      - name: 打包 Linux amd64
        run: tar -czf fishtty-agent-linux-amd64.tar.gz -C deploy/linux-amd64 .

      - name: 打包 Linux arm64
        run: tar -czf fishtty-agent-linux-arm64.tar.gz -C deploy/linux-arm64 .

      - name: 打包 macOS arm64
        run: tar -czf fishtty-agent-darwin-arm64.tar.gz -C deploy/darwin-arm64 .

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — ${{ github.sha }}
          tag_name: ${{ github.sha }}
          files: |
            fishtty-agent-linux-amd64.tar.gz
            fishtty-agent-linux-arm64.tar.gz
            fishtty-agent-darwin-arm64.tar.gz
          body: |
            ## 部署说明

            此版本配套的 Docker 镜像已推送到 GHCR：

            ```bash
            docker pull ghcr.io/${{ github.repository }}-server:latest
            ```

            ### Agent 部署

            下载对应平台的 `tar.gz`，解压后运行 `./install.sh`：

            ```bash
            # Linux (amd64)
            tar -xzf fishtty-agent-linux-amd64.tar.gz && sudo ./install.sh

            # Linux (arm64 / 树莓派)
            tar -xzf fishtty-agent-linux-arm64.tar.gz && sudo ./install.sh

            # macOS (Apple Silicon)
            tar -xzf fishtty-agent-darwin-arm64.tar.gz && ./install.sh
            ```

            安装后编辑配置文件填入 server 地址和 token，然后启动守护进程。
          draft: false
          prerelease: false
