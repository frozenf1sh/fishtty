# ── fishtty-agent 配置文件 ──
# 默认路径：./fishtty-agent.yaml、/etc/fishtty/fishtty-agent.yaml、~/.config/fishtty/fishtty-agent.yaml
# 环境变量覆盖：FISHTTY_SERVER、FISHTTY_TOKEN、FISHTTY_DEVICE_ID 等

server: "https://fishtty.example.com"  # Server 地址（必填）

# token: "your-device-token-here"       # 认证令牌（必填，也可用环境变量 FISHTTY_TOKEN）

device_id: ""                           # 设备 ID（留空 = 自动使用主机名）

log_level: "info"                       # debug | info | warn | error

heartbeat:
  interval: 15s                         # 心跳间隔
  miss_threshold: 3                     # 连续几次未收到 ACK 视为断连

reconnect:
  min_delay: 1s                         # 重连初始延迟
  max_delay: 60s                        # 重连最大延迟
  reset_after: 30s                      # 稳定连接多久后重置退避

ring_buffer:
  size_kb: 128                          # PTY 输出历史缓冲区（KB）
