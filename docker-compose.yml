# fishtty 生产部署编排（Docker Compose + Caddy TLS 反代）
#
# 快速部署：
#   1. 编辑 configs/fishtty-server.yaml 配置 Server
#   2. 编辑 Caddyfile 替换域名
#   3. docker compose pull   # 拉取最新镜像
#   4. docker compose up -d
#
# 更新镜像：
#   docker compose pull && docker compose up -d

services:
  # ── TLS 反向代理 ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # ── fishtty 中继服务 ──
  server:
    image: ghcr.io/frozenf1sh/fishtty-server:latest
    restart: unless-stopped
    expose:
      - "8443"
    volumes:
      - ./configs/fishtty-server.yaml:/etc/fishtty/fishtty-server.yaml:ro
    command: ["--config", "/etc/fishtty/fishtty-server.yaml", "--listen", ":8443"]
    # 注：/health 端点可供外部监控（K8s probes、Caddy health_check 等）。
    # 因 distroless 镜像不含 curl/wget，Docker Compose 内置 healthcheck 需另配。

volumes:
  caddy_data:
  caddy_config:
