# fishtty 生产部署编排（Docker Compose + Caddy TLS 反代）
#
# 使用：
#   1. 编辑 configs/fishtty-server.yaml 配置 Server
#   2. 编辑 Caddyfile 替换域名
#   3. docker compose up -d

services:
  # ── TLS 反向代理 ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  # ── fishtty 中继服务 ──
  server:
    build: .
    restart: unless-stopped
    expose:
      - "8443"
    volumes:
      - ./configs/fishtty-server.yaml:/etc/fishtty/fishtty-server.yaml:ro
    environment:
      - FISHTTY_LOG_LEVEL=info
    command: ["--config", "/etc/fishtty/fishtty-server.yaml", "--listen", ":8443"]

volumes:
  caddy_data:
  caddy_config:
